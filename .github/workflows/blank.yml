
name: GitHub Profile Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate dark statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Iarley120
          template: classic
          base: header, activity, community, repositories, metadata
          filename: overviewDarkMode.svg
          config_display: large
          config_timezone: America/Sao_Paulo
          config_output: svg
          config_padding: 0, 8 + 11%
          config_order: base.header, base.activity+community, base.repositories, base.metadata
          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #161b22;
            }

      - name: Generate language statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Iarley120
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          filename: languagesDarkMode.svg
          config_output: svg
          config_timezone: America/Sao_Paulo
